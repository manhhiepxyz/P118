version: "3.8"

services:
  # ----------------------------------------------------------------
  # PostgreSQL — database chính của P-118
  # ----------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: p118_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-p118}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-p118pass}
      POSTGRES_DB: ${POSTGRES_DB:-p118_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-p118} -d ${POSTGRES_DB:-p118_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Backend — FastAPI app
  # ----------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p118_backend
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      # Override DATABASE_URL để trỏ vào postgres service trong compose network
      DATABASE_URL: postgresql://${POSTGRES_USER:-p118}:${POSTGRES_PASSWORD:-p118pass}@postgres:5432/${POSTGRES_DB:-p118_db}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy   # chờ postgres sẵn sàng mới start backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # ----------------------------------------------------------------
  # Mock API — chạy riêng cổng 8001 (phát triển nội bộ)
  # ----------------------------------------------------------------
  mock:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: p118_mock
    command: ["uvicorn", "src.mock.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-p118}:${POSTGRES_PASSWORD:-p118pass}@postgres:5432/${POSTGRES_DB:-p118_db}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - mock   # chỉ chạy khi: docker compose --profile mock up

volumes:
  postgres_data:
    driver: local
