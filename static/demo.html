<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>P-118 · Trợ lý dịch vụ cư dân</title>
    <style>
      :root {
        --bg: #f7f7f9;
        --surface: #ffffff;
        --surface-2: #f4f4f7;
        --surface-3: #ececf2;
        --line: #e3e3ea;
        --line-2: #d3d3de;

        --ink: #17171f;
        --ink-2: #55555f;
        --ink-3: #8b8b98;

        --brand: #4338ca;
        --brand-ink: #322aa0;
        --brand-soft: #eeecfb;
        --brand-line: #c9c3f2;

        --ok: #0a6c45;
        --ok-soft: #e8f6ef;
        --ok-line: #b8e2cd;
        --warn: #8a5300;
        --warn-soft: #fdf3e2;
        --warn-line: #efd39a;
        --err: #a3231b;
        --err-soft: #fdeeed;
        --err-line: #f0c4c1;

        --r: 10px;
        --r-lg: 14px;
        --shadow-1: 0 1px 2px rgba(16, 16, 32, 0.06);
      }

      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { margin: 0; height: 100%; }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      button { font: inherit; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .55; }
      input, select, textarea { font: inherit; color: inherit; }
      :focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; border-radius: 4px; }

      .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }

      /* ---------------- Sidebar ---------------- */
      .sidebar {
        background: var(--surface); border-right: 1px solid var(--line);
        padding: 16px 12px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto;
      }
      .brand { display: flex; align-items: center; gap: 9px; padding: 2px 6px 0; }
      .brand-mark {
        width: 30px; height: 30px; border-radius: 8px; background: var(--brand);
        color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 12px;
      }
      .brand-name { font-weight: 650; font-size: 14.5px; letter-spacing: -.01em; }
      .brand-sub { font-size: 11.5px; color: var(--ink-3); }

      .nav { display: flex; flex-direction: column; gap: 1px; }
      .nav-label {
        font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
        color: var(--ink-3); padding: 0 8px 6px;
      }
      .nav button {
        display: flex; align-items: center; gap: 9px; padding: 7px 8px; width: 100%;
        border: 0; border-radius: 7px; background: transparent;
        color: var(--ink-2); font-size: 13.5px; text-align: left;
      }
      .nav button:hover { background: var(--surface-2); color: var(--ink); }
      .nav button[aria-current="page"] { background: var(--brand-soft); color: var(--brand-ink); font-weight: 600; }
      .nav .ico { width: 16px; text-align: center; font-size: 13px; flex: none; }
      .nav .count {
        margin-left: auto; background: var(--warn); color: #fff;
        font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; min-width: 19px; text-align: center;
      }

      .side-foot { margin-top: auto; }
      .acct { background: var(--surface-2); border-radius: var(--r); padding: 10px; }
      .acct-row { display: flex; gap: 9px; align-items: center; }
      .avatar {
        width: 30px; height: 30px; border-radius: 50%; flex: none;
        background: var(--brand-soft); color: var(--brand-ink);
        display: grid; place-items: center; font-weight: 650; font-size: 12px;
      }
      .acct-name { font-size: 13px; font-weight: 600; }
      .acct-meta { font-size: 11.5px; color: var(--ink-2); }
      .persona { display: flex; gap: 5px; margin-top: 9px; }
      .persona button {
        flex: 1; padding: 5px 6px; font-size: 11.5px; font-weight: 550;
        border-radius: 6px; border: 1px solid var(--line-2); background: var(--surface); color: var(--ink-2);
      }
      .persona button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }

      /* ---------------- Main ---------------- */
      .main { display: flex; flex-direction: column; min-width: 0; }
      .topbar {
        height: 56px; flex: none; border-bottom: 1px solid var(--line); background: var(--surface);
        display: flex; align-items: center; gap: 16px; padding: 0 24px;
      }
      .crumb { font-size: 13px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .crumb b { color: var(--ink); font-weight: 600; }
      .crumb button { border: 0; background: none; color: var(--brand-ink); padding: 0; font-size: 13px; }

      .composer {
        margin-left: auto; display: flex; align-items: center; gap: 8px;
        background: var(--surface-2); border: 1px solid var(--line-2);
        border-radius: 8px; padding: 0 10px; height: 36px; width: min(420px, 40vw);
      }
      .composer:focus-within { border-color: var(--brand); background: var(--surface); }
      .composer input { border: 0; background: transparent; outline: none; flex: 1; font-size: 13.5px; }
      .composer input::placeholder { color: var(--ink-3); }
      .composer kbd {
        font: 600 10.5px/1 ui-monospace, monospace; color: var(--ink-3);
        border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px; background: var(--surface);
      }

      .scroll { flex: 1; overflow-y: auto; padding: 22px 24px 44px; }
      .wrap { max-width: 1100px; }

      .sec { margin-bottom: 26px; }
      .sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
      .sec-title { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

      .greet { margin-bottom: 22px; }
      .greet h1 { margin: 0 0 6px; font-size: 22px; font-weight: 680; letter-spacing: -.02em; }
      .verify {
        display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 550;
        background: var(--ok-soft); color: var(--ok); border: 1px solid var(--ok-line);
        padding: 3px 9px; border-radius: 999px;
      }
      .verify.guest { background: var(--surface-2); color: var(--ink-2); border-color: var(--line-2); }

      /* ---------------- Cần bạn xử lý ---------------- */
      .attention {
        background: var(--warn-soft); border: 1px solid var(--warn-line);
        border-left: 3px solid var(--warn); border-radius: var(--r-lg);
        padding: 14px 16px; box-shadow: var(--shadow-1); margin-bottom: 12px;
      }
      .attention-head {
        display: flex; align-items: center; gap: 7px; margin-bottom: 10px;
        font-size: 11.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--warn);
      }
      .att-title { font-size: 15px; font-weight: 640; margin-bottom: 3px; }
      .att-body { font-size: 13.5px; color: var(--ink-2); }
      .amount { font-size: 19px; font-weight: 700; letter-spacing: -.01em; margin-top: 6px; font-variant-numeric: tabular-nums; }
      .ro { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--ink-3); margin-top: 5px; }
      .att-actions { display: flex; align-items: center; gap: 8px; margin-top: 12px; flex-wrap: wrap; }

      .btn { border-radius: 8px; padding: 8px 14px; font-size: 13.5px; font-weight: 600; border: 1px solid transparent; }
      .btn.primary { background: var(--brand); color: #fff; }
      .btn.primary:hover:not(:disabled) { background: var(--brand-ink); }
      .btn.ghost { background: var(--surface); border-color: var(--line-2); color: var(--ink-2); }
      .btn.ghost:hover:not(:disabled) { background: var(--surface-2); }

      /* ---------------- Hàng workflow ---------------- */
      .rows { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
      .row {
        display: grid; grid-template-columns: 26px minmax(0,1fr) 180px 116px;
        gap: 14px; align-items: center; padding: 13px 16px; width: 100%;
        border: 0; border-bottom: 1px solid var(--line); background: none; text-align: left;
      }
      .row:last-child { border-bottom: 0; }
      .row:hover { background: var(--surface-2); }
      .row-title { font-size: 14.5px; font-weight: 600; display: block; }
      .row-step { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; display: block; }
      .row-meta { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

      .mark { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; }
      .mark.run { background: var(--brand-soft); color: var(--brand-ink); }
      .mark.ok { background: var(--ok-soft); color: var(--ok); }
      .mark.wait { background: var(--warn-soft); color: var(--warn); }
      .mark.err { background: var(--err-soft); color: var(--err); }
      .mark.idle { background: var(--surface-3); color: var(--ink-3); }

      .bar { height: 5px; background: var(--surface-3); border-radius: 99px; overflow: hidden; display: block; }
      .bar > i { display: block; height: 100%; background: var(--brand); border-radius: 99px; transition: width .3s ease; }
      .bar.ok > i { background: var(--ok); }

      .pill {
        display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600;
        padding: 2px 8px; border-radius: 999px; border: 1px solid transparent; white-space: nowrap;
      }
      .pill.run { background: var(--brand-soft); color: var(--brand-ink); border-color: var(--brand-line); }
      .pill.ok { background: var(--ok-soft); color: var(--ok); border-color: var(--ok-line); }
      .pill.wait { background: var(--warn-soft); color: var(--warn); border-color: var(--warn-line); }
      .pill.err { background: var(--err-soft); color: var(--err); border-color: var(--err-line); }
      .pill.idle { background: var(--surface-2); color: var(--ink-2); border-color: var(--line-2); }

      /* ---------------- Thẻ mục tiêu ---------------- */
      .goals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
      .goal {
        background: var(--surface); border: 1px solid var(--line); border-radius: var(--r);
        padding: 13px 12px; text-align: left; display: flex; flex-direction: column; gap: 8px; min-height: 92px;
      }
      .goal:hover:not(.locked) { border-color: var(--brand-line); background: var(--brand-soft); }
      .goal .gi {
        width: 28px; height: 28px; border-radius: 7px; background: var(--brand-soft);
        color: var(--brand-ink); display: grid; place-items: center; font-size: 13px;
      }
      .goal .gt { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
      .goal.locked { background: var(--surface-2); border-style: dashed; cursor: not-allowed; }
      .goal.locked .gi { background: var(--surface-3); color: var(--ink-3); }
      .goal.locked .gt { color: var(--ink-3); }
      .lock-note { font-size: 11px; color: var(--ink-3); display: flex; align-items: center; gap: 4px; }

      .empty {
        background: var(--surface); border: 1px dashed var(--line-2); border-radius: var(--r-lg);
        padding: 22px; text-align: center; color: var(--ink-2); font-size: 13.5px;
      }

      /* ---------------- Workflow detail ---------------- */
      .wf-head { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 18px 20px; margin-bottom: 18px; }
      .wf-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .wf-title { font-size: 20px; font-weight: 670; letter-spacing: -.02em; }
      .objective {
        margin: 10px 0 14px; padding: 9px 12px; background: var(--surface-2);
        border-left: 2px solid var(--line-2); border-radius: 0 7px 7px 0;
        font-size: 13.5px; color: var(--ink-2); font-style: italic;
      }
      .wf-progress { display: flex; align-items: center; gap: 12px; }
      .wf-progress .bar { flex: 1; }
      .wf-cur { font-size: 13.5px; color: var(--ink-2); margin-bottom: 9px; }
      .wf-cur b { color: var(--ink); font-weight: 600; }

      .cols { display: grid; grid-template-columns: minmax(0,1fr) 360px; gap: 18px; align-items: start; }
      .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
      .panel-head {
        padding: 12px 16px; border-bottom: 1px solid var(--line);
        font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3);
      }

      ol.steps { list-style: none; margin: 0; padding: 6px 0; }
      ol.steps li { display: flex; gap: 12px; padding: 11px 16px; }
      .s-mark {
        width: 22px; height: 22px; border-radius: 50%; flex: none; margin-top: 1px;
        display: grid; place-items: center; font-size: 11px; font-weight: 700;
        background: var(--surface-3); color: var(--ink-3);
      }
      li.done .s-mark { background: var(--ok-soft); color: var(--ok); }
      li.cur .s-mark { background: var(--brand-soft); color: var(--brand-ink); }
      li.wait .s-mark { background: var(--warn-soft); color: var(--warn); }
      li.err .s-mark { background: var(--err-soft); color: var(--err); }
      .s-name { font-size: 14px; font-weight: 550; display: block; }
      li.cur .s-name { font-weight: 650; }
      li.todo .s-name { color: var(--ink-3); }
      .s-note { font-size: 12.5px; color: var(--ink-2); margin-top: 2px; display: block; }
      .kv { margin: 7px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; }
      .kv dt { color: var(--ink-3); }
      .kv dd { margin: 0; color: var(--ink); }

      ul.log { list-style: none; margin: 0; padding: 6px 0; }
      ul.log li { display: flex; gap: 10px; padding: 8px 16px; font-size: 13px; color: var(--ink-2); }
      ul.log .lm { width: 6px; height: 6px; border-radius: 50%; background: var(--line-2); margin-top: 7px; flex: none; }
      ul.log li:last-child { color: var(--ink); font-weight: 550; }
      ul.log li:last-child .lm { background: var(--brand); }

      /* ---------------- Form bổ sung ---------------- */
      .fields { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; margin-top: 12px; }
      .field { display: flex; flex-direction: column; gap: 5px; }
      .field.full { grid-column: 1 / -1; }
      .field label { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
      .field input, .field select, .field textarea {
        border: 1px solid var(--line-2); border-radius: 7px; padding: 8px 10px;
        background: var(--surface); font-size: 13.5px; width: 100%;
      }
      .field input:focus, .field select:focus, .field textarea:focus { border-color: var(--brand); outline: none; }
      .field-hint { font-size: 11.5px; color: var(--ink-3); }

      .toast {
        position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
        background: var(--ink); color: #fff; padding: 9px 16px; border-radius: 8px;
        font-size: 13px; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); z-index: 50;
      }

      .spinner {
        width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent;
        border-radius: 50%; display: inline-block; animation: spin .7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      @media (max-width: 1180px) {
        .goals { grid-template-columns: repeat(3, 1fr); }
        .cols { grid-template-columns: 1fr; }
      }
      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; height: auto; }
        .sidebar { flex-direction: row; align-items: center; gap: 14px; overflow-x: auto; }
        .side-foot { margin: 0; }
        .goals { grid-template-columns: repeat(2, 1fr); }
        .fields { grid-template-columns: 1fr; }
        .row { grid-template-columns: 26px 1fr; }
        .row > :nth-child(3), .row > :nth-child(4) { display: none; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <!-- ============================ Sidebar ============================ -->
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">P118</div>
          <div>
            <div class="brand-name">P-118</div>
            <div class="brand-sub">Trợ lý dịch vụ cư dân</div>
          </div>
        </div>

        <nav class="nav" aria-label="Điều hướng chính">
          <div class="nav-label">Không gian làm việc</div>
          <button type="button" data-view="overview" aria-current="page"><span class="ico" aria-hidden="true">◇</span>Tổng quan</button>
          <button type="button" data-view="running"><span class="ico" aria-hidden="true">◐</span>Đang thực hiện</button>
          <button type="button" data-view="attention">
            <span class="ico" aria-hidden="true">⏸</span>Chờ bạn xử lý
            <span class="count" id="attentionCount" hidden>0</span>
          </button>
          <button type="button" data-view="completed"><span class="ico" aria-hidden="true">✓</span>Đã hoàn thành</button>
          <div class="nav-label" style="margin-top:14px">Tài khoản</div>
          <button type="button" data-view="services"><span class="ico" aria-hidden="true">▤</span>Dịch vụ</button>
          <button type="button" data-view="profile"><span class="ico" aria-hidden="true">◉</span>Hồ sơ cư dân</button>
        </nav>

        <div class="side-foot">
          <div class="acct">
            <div class="acct-row">
              <div class="avatar" id="acctInitials">LB</div>
              <div>
                <div class="acct-name" id="acctName">Lâm Thành Bảo</div>
                <div class="acct-meta" id="acctMeta">Căn hộ A1201</div>
              </div>
            </div>
            <div class="persona" role="group" aria-label="Chế độ tài khoản demo">
              <button type="button" data-persona="resident" aria-pressed="true">Cư dân</button>
              <button type="button" data-persona="prospect" aria-pressed="false">Khách</button>
            </div>
          </div>
        </div>
      </aside>

      <!-- ============================ Main ============================ -->
      <div class="main">
        <div class="topbar">
          <div class="crumb" id="crumb"><b>Tổng quan</b></div>
          <div class="composer">
            <span aria-hidden="true" style="color:var(--ink-3)">✎</span>
            <input id="goalInput" autocomplete="off" placeholder="Giao việc cho P-118…" aria-label="Giao việc cho P-118" />
            <kbd aria-hidden="true">↵</kbd>
          </div>
        </div>

        <div class="scroll">
          <!-- ---------------- Workspace Home ---------------- -->
          <div class="wrap" id="homeView">
            <div class="greet">
              <h1 id="greeting">Chào Thành Bảo</h1>
              <span class="verify" id="verifyPill">✓ Đã liên kết căn hộ A1201</span>
            </div>

            <section class="sec" id="attentionSection" hidden aria-live="polite" aria-label="Cần bạn xử lý">
              <div class="sec-head"><span class="sec-title" id="attentionTitle">Cần bạn xử lý</span></div>
              <div id="attentionList"></div>
            </section>

            <section class="sec" id="activeSection">
              <div class="sec-head"><span class="sec-title" id="activeTitle">Đang thực hiện</span></div>
              <div id="activeList"></div>
            </section>

            <section class="sec" id="goalSection">
              <div class="sec-head"><span class="sec-title">Bắt đầu nhanh</span></div>
              <div class="goals" id="goalCards"></div>
            </section>

            <section class="sec" id="completedSection" hidden>
              <div class="sec-head"><span class="sec-title">Vừa hoàn thành</span></div>
              <div id="completedList"></div>
            </section>
          </div>

          <!-- ---------------- Workflow detail ---------------- -->
          <div class="wrap" id="detailView" hidden>
            <div class="wf-head">
              <div class="wf-top">
                <span class="wf-title" id="wfTitle">Yêu cầu dịch vụ</span>
                <span class="pill idle" id="wfStatus">Đang chuẩn bị</span>
              </div>
              <div class="objective" id="wfObjective" hidden></div>
              <div class="wf-cur" id="wfCurrent" hidden></div>
              <div class="wf-progress">
                <span class="bar"><i id="wfBar" style="width:0%"></i></span>
                <span class="row-meta" id="wfCount">Đang chuẩn bị</span>
              </div>
            </div>

            <div id="wfAction"></div>

            <div class="cols">
              <div class="panel">
                <div class="panel-head">Các bước</div>
                <ol class="steps" id="wfSteps"></ol>
              </div>
              <div class="panel">
                <div class="panel-head">Hoạt động</div>
                <ul class="log" id="wfLog"></ul>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      // =================================================================
      // Giao diện KHÔNG dựng TaskPlan và không giữ dữ liệu giả.
      // Nó gửi mục tiêu, rồi hiển thị lại đúng những gì backend trả về.
      // Mọi tiến độ đều đếm từ `tasks[]` thật.
      // =================================================================
      const API = "/api/v1/workflows/demo";

      // Trạng thái → nhãn nghiệp vụ + tông màu + icon. Icon và chữ luôn đi
      // cùng nhau: không dựa vào riêng màu để truyền đạt trạng thái.
      const WORKFLOW_STATUS = {
        PENDING:           ["Đang chuẩn bị", "idle", "◔"],
        RUNNING:           ["Đang thực hiện", "run", "◐"],
        WAITING_APPROVAL:  ["Chờ bạn xác nhận", "wait", "⏸"],
        NEEDS_INFORMATION: ["Cần thêm thông tin", "wait", "✎"],
        SUCCESS:           ["Hoàn tất", "ok", "✓"],
        FAILED:            ["Không thành công", "err", "✕"],
        CANCELLED:         ["Đã huỷ", "idle", "○"],
        PLANNING_ERROR:    ["Chưa lập được kế hoạch", "err", "✕"],
        VALIDATION_ERROR:  ["Chưa đủ điều kiện thực hiện", "err", "✕"],
        EXECUTION_ERROR:   ["Có lỗi khi thực hiện", "err", "✕"],
      };

      const TASK_STATUS = {
        PENDING:          ["Đang chờ", "todo", "○"],
        RUNNING:          ["Đang thực hiện", "cur", "◐"],
        WAITING_APPROVAL: ["Chờ bạn xác nhận", "wait", "⏸"],
        SUCCESS:          ["Hoàn tất", "done", "✓"],
        FAILED:           ["Không thành công", "err", "✕"],
        CANCELLED:        ["Đã huỷ", "todo", "○"],
        NOT_RUN:          ["Chưa chạy", "todo", "○"],
      };

      const TERMINAL = new Set([
        "SUCCESS", "FAILED", "CANCELLED", "NEEDS_INFORMATION",
        "WAITING_APPROVAL", "PLANNING_ERROR", "VALIDATION_ERROR", "EXECUTION_ERROR",
      ]);

      // Mỗi thẻ là MỘT mục tiêu gửi thẳng cho agent. Bấm là giao việc luôn,
      // không bắt người dùng chọn dịch vụ rồi mô tả lại cùng nội dung.
      const GOALS = [
        { key: "parking", icon: "P", label: "Đăng ký xe và chỗ đậu", resident: true,
          goal: "Tôi muốn đăng ký xe và đặt chỗ đậu xe. Hãy dùng thông tin đã có trong tài khoản và chỉ hỏi phần còn thiếu." },
        { key: "moving", icon: "↗", label: "Đăng ký chuyển nhà", resident: true,
          goal: "Tôi muốn đặt lịch chuyển nhà. Hãy dùng thông tin đã có trong tài khoản và chỉ hỏi phần còn thiếu." },
        { key: "maintenance", icon: "⚒", label: "Báo hỏng cần sửa", resident: true,
          goal: "Tôi muốn báo hỏng và đặt lịch bảo trì căn hộ. Hãy dùng thông tin đã có trong tài khoản và chỉ hỏi phần còn thiếu." },
        { key: "viewing", icon: "◎", label: "Đặt lịch tham quan dự án", resident: false, contact: true,
          goal: "Tôi muốn đặt lịch tham quan dự án. Hãy dùng thông tin đã có trong tài khoản và chỉ hỏi phần còn thiếu." },
        { key: "consult", icon: "☎", label: "Nhận tư vấn", resident: false, contact: true,
          goal: "Tôi muốn được tư vấn về dự án. Hãy dùng thông tin đã có trong tài khoản và chỉ hỏi phần còn thiếu." },
      ];

      const ACCOUNT = { full_name: "Lâm Thành Bảo", phone: "0901234567", email: "thanhbao@example.com" };
      const PREFILL_HINT = "Đã tự điền từ tài khoản · bạn có thể chỉnh";

      const isoToday = (offset) => {
        const d = new Date();
        d.setDate(d.getDate() + offset);
        return d.toISOString().slice(0, 10);
      };

      // Chỉ những field NGƯỜI DÙNG biết mới có mặt. Không có ID nội bộ, không
      // có số tiền — backend đã lọc từ trước, và giao diện cũng không dựng
      // input cho thứ nó không hiểu.
      const FIELDS = {
        project_id: { label: "Dự án quan tâm", options: [["Vinhomes Sài Gòn Park","Vinhomes Sài Gòn Park"],["Vinhomes Global Gate Hạ Long","Vinhomes Global Gate Hạ Long"],["Vinhomes Hải Vân Bay","Vinhomes Hải Vân Bay"],["Vinhomes Pearl Bay","Vinhomes Pearl Bay"],["Vinhomes Green Paradise","Vinhomes Green Paradise"],["Vinhomes Golden City","Vinhomes Golden City"],["Vinhomes Ocean Park","Vinhomes Ocean Park"]] },
        interest_type: { label: "Nhu cầu của bạn", options: [["consultation","Nhận tư vấn"],["buy","Mua"],["rent","Thuê"]] },
        preferred_contact_time: { label: "Thời gian tiện liên hệ", options: [["morning","Buổi sáng"],["afternoon","Buổi chiều"],["evening","Buổi tối"]] },
        consent: { label: "Đồng ý nhận liên hệ", options: [["true","Tôi đồng ý"]] },
        viewing_date: { label: "Ngày muốn xem", type: "date" },
        viewing_time: { label: "Giờ muốn xem", type: "time", min: "08:00", max: "17:30", hint: "Trong khung 08:00–17:30" },
        plate_number: { label: "Biển số xe", placeholder: "VD: 51A-12345" },
        vehicle_type: { label: "Loại xe", options: [["car","Ô tô"],["motorcycle","Xe máy"]] },
        parking_zone: { label: "Khu vực đậu xe", options: [["ZONE_A","Khu A"],["ZONE_B","Khu B"]] },
        booking_date: { label: "Ngày muốn đặt chỗ", type: "date" },
        issue_type: { label: "Hạng mục cần sửa", options: [["air_conditioning","Điều hòa"],["electrical","Điện"],["plumbing","Nước / ống nước"],["other","Khác"]] },
        description: { label: "Mô tả sự cố", placeholder: "VD: điều hòa chạy nhưng không mát" },
        location: { label: "Vị trí trong căn hộ", placeholder: "VD: phòng khách" },
        preferred_date: { label: "Ngày muốn bảo trì", type: "date" },
        preferred_time: { label: "Giờ muốn bảo trì", type: "time", min: "08:00", max: "18:00", hint: "Trong khung 08:00–18:00" },
        move_date: { label: "Ngày chuyển nhà", type: "date" },
        move_time: { label: "Giờ chuyển nhà", type: "time", min: "07:00", max: "20:00", hint: "Trong khung 07:00–20:00" },
        needs_elevator: { label: "Cần đăng ký thang máy?", options: [["true","Có"],["false","Không"]] },
        needs_loading_support: { label: "Cần hỗ trợ bốc dỡ?", options: [["true","Có"],["false","Không"]] },
        move_vehicle: { label: "Phương tiện vận chuyển", options: [["truck","Xe tải"],["van","Xe van"],["none","Không cần xe"]] },
        full_name: { label: "Họ và tên", value: ACCOUNT.full_name, hint: PREFILL_HINT },
        phone: { label: "Số điện thoại", type: "tel", value: ACCOUNT.phone, hint: PREFILL_HINT },
        email: { label: "Email", type: "email", value: ACCOUNT.email, required: false, hint: PREFILL_HINT },
        contact_note: { label: "Bạn muốn được tư vấn thêm điều gì?", type: "textarea", required: false, full: true },
      };

      const state = {
        accountState: "resident",
        contactFlow: false,
        workflowId: null,
        pollTimer: null,
        pollDelay: 1000,
        busy: false,
        goals: {},
      };

      const $ = (id) => document.getElementById(id);
      const money = (amount, currency) => `${Number(amount).toLocaleString("vi-VN")} ${currency}`;

      function toast(text) {
        document.querySelector(".toast")?.remove();
        const el = document.createElement("div");
        el.className = "toast";
        el.setAttribute("role", "status");
        el.textContent = text;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3400);
      }

      async function api(path, options) {
        const response = await fetch(path, options);
        let data = null;
        try { data = await response.json(); } catch { data = null; }
        if (!response.ok) throw new Error((data && data.detail) || "Chưa xử lý được yêu cầu.");
        return data;
      }

      function el(tag, props, ...children) {
        const node = Object.assign(document.createElement(tag), props || {});
        children.filter(Boolean).forEach((c) => node.append(c));
        return node;
      }

      // =================================================================
      // Điều hướng — chi tiết workflow có URL riêng; refresh đọc lại theo ID
      // =================================================================
      function stopPolling() {
        if (state.pollTimer) { clearTimeout(state.pollTimer); state.pollTimer = null; }
        state.pollDelay = 1000;
      }

      function markNav(view) {
        document.querySelectorAll("[data-view]").forEach((b) =>
          b.setAttribute("aria-current", b.dataset.view === view ? "page" : "false"));
      }

      function showHome(push = true) {
        stopPolling();
        state.workflowId = null;
        $("homeView").hidden = false;
        $("detailView").hidden = true;
        $("crumb").replaceChildren(el("b", { textContent: "Tổng quan" }));
        markNav("overview");
        $("goalSection").hidden = false;
        if (push) history.pushState({}, "", "/demo");
        refreshHome();
      }

      function showDetail(workflowId, push = true) {
        state.workflowId = workflowId;
        $("homeView").hidden = true;
        $("detailView").hidden = false;
        const back = el("button", { type: "button", textContent: "Tổng quan" });
        back.addEventListener("click", () => showHome());
        $("crumb").replaceChildren(back, document.createTextNode(" / "), el("b", { textContent: "Chi tiết yêu cầu" }));
        markNav("running");
        if (push) history.pushState({ workflowId }, "", `/demo?workflow_id=${encodeURIComponent(workflowId)}`);
        loadWorkflow(workflowId);
      }

      window.addEventListener("popstate", () => {
        const id = new URLSearchParams(location.search).get("workflow_id");
        if (id) showDetail(id, false); else showHome(false);
      });

      // =================================================================
      // Workspace Home — dữ liệu thật từ GET /workflows/demo
      // =================================================================
      async function refreshHome() {
        try {
          const [attention, running, completed] = await Promise.all([
            api(`${API}?status=attention&limit=10`),
            api(`${API}?status=running&limit=10`),
            api(`${API}?status=completed&limit=5`),
          ]);
          renderAttention(attention.items || []);
          renderActive(running.items || [], "Đang thực hiện");
          renderCompleted(completed.items || []);
        } catch {
          renderAttention([]);
          $("activeList").replaceChildren(emptyBox("Chưa đọc được danh sách yêu cầu."));
        }
      }

      const emptyBox = (text) => el("div", { className: "empty", textContent: text });

      function renderAttention(items) {
        const badge = $("attentionCount");
        badge.hidden = items.length === 0;
        badge.textContent = String(items.length);
        $("attentionSection").hidden = items.length === 0;
        $("attentionTitle").textContent = `Cần bạn xử lý (${items.length})`;

        const host = $("attentionList");
        host.replaceChildren();
        items.forEach((item) => {
          const open = el("button", { className: "btn primary", type: "button", textContent: "Mở để xử lý" });
          open.addEventListener("click", () => showDetail(item.workflow_id));
          host.appendChild(
            el("div", { className: "attention" },
              el("div", { className: "attention-head", textContent: "▲ Cần bạn xử lý" }),
              el("div", { className: "att-title", textContent: item.title }),
              el("div", { className: "att-body", textContent: "Yêu cầu này đang chờ quyết định của bạn." }),
              el("div", { className: "att-actions" }, open)),
          );
        });
      }

      function workflowRow(item) {
        const [label, tone, icon] = WORKFLOW_STATUS[item.status] || WORKFLOW_STATUS.PENDING;
        const total = item.total_tasks || 0;
        const done = item.completed_tasks || 0;

        const bar = el("span", { className: `bar ${item.status === "SUCCESS" ? "ok" : ""}` },
          el("i", { style: `width:${total ? Math.round((done / total) * 100) : 0}%` }));
        const meta = el("span", {
          className: "row-meta",
          textContent: total ? `${done}/${total} bước` : "Đang chuẩn bị",
        });
        meta.style.cssText = "display:block;margin-top:5px";

        const right = el("span", {}, el("span", { className: `pill ${tone}`, textContent: `${icon} ${label}` }));
        right.style.textAlign = "right";

        const row = el("button", { type: "button", className: "row" },
          el("span", { className: `mark ${tone}`, textContent: icon, "aria-hidden": "true" }),
          el("span", {},
            el("span", { className: "row-title", textContent: item.title }),
            el("span", { className: "row-step", textContent: item.current_step || label })),
          el("span", {}, bar, meta),
          right);
        row.querySelector(".mark").setAttribute("aria-hidden", "true");
        row.addEventListener("click", () => showDetail(item.workflow_id));
        return row;
      }

      function renderActive(items, title) {
        $("activeTitle").textContent = title;
        const host = $("activeList");
        if (!items.length) {
          host.replaceChildren(emptyBox("Chưa có yêu cầu nào ở đây. Chọn một mục bên dưới hoặc mô tả việc bạn cần."));
          return;
        }
        const box = el("div", { className: "rows" });
        items.forEach((item) => box.appendChild(workflowRow(item)));
        host.replaceChildren(box);
      }

      function renderCompleted(items) {
        $("completedSection").hidden = items.length === 0;
        if (!items.length) return;
        const box = el("div", { className: "rows" });
        items.forEach((item) => box.appendChild(workflowRow(item)));
        $("completedList").replaceChildren(box);
      }

      // =================================================================
      // Thẻ mục tiêu — dịch vụ cư dân bị KHOÁ chứ không bị ẩn
      // =================================================================
      function renderGoals() {
        const resident = state.accountState === "resident";
        const host = $("goalCards");
        host.replaceChildren();
        GOALS.forEach((item) => {
          const locked = item.resident && !resident;
          const card = el("button", { type: "button", className: `goal${locked ? " locked" : ""}` },
            el("span", { className: "gi", textContent: locked ? "🔒" : item.icon }),
            el("span", { className: "gt", textContent: item.label }));
          card.querySelector(".gi").setAttribute("aria-hidden", "true");

          if (locked) {
            card.setAttribute("aria-disabled", "true");
            card.appendChild(el("span", { className: "lock-note", textContent: "Cần liên kết căn hộ" }));
            card.addEventListener("click", () =>
              toast("Dịch vụ này chỉ dành cho tài khoản đã liên kết căn hộ."));
          } else {
            card.addEventListener("click", () => {
              state.contactFlow = Boolean(item.contact);
              startWorkflow(item.goal);
            });
          }
          host.appendChild(card);
        });
      }

      function applyPersona() {
        const resident = state.accountState === "resident";
        $("acctName").textContent = resident ? ACCOUNT.full_name : "Khách tham quan";
        $("acctInitials").textContent = resident ? "LB" : "K";
        $("acctMeta").textContent = resident ? "Căn hộ A1201" : "Chưa liên kết căn hộ";
        $("greeting").textContent = resident ? "Chào Thành Bảo" : "Chào bạn";
        const pill = $("verifyPill");
        pill.className = `verify${resident ? "" : " guest"}`;
        pill.textContent = resident ? "✓ Đã liên kết căn hộ A1201" : "○ Chưa liên kết căn hộ";
        renderGoals();
      }

      // =================================================================
      // Giao việc
      // =================================================================
      async function startWorkflow(goal) {
        if (state.busy) return;
        state.busy = true;
        try {
          const data = await api(`${API}/start`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              goal,
              approve_mock_payment: false,
              account_state: state.accountState,
              project_name: null,
              contact_profile: contactProfile(),
            }),
          });
          state.goals[data.workflow_id] = goal;
          showDetail(data.workflow_id);
        } catch (error) {
          toast(error.message);
        } finally {
          state.busy = false;
        }
      }

      function contactProfile() {
        if (!state.contactFlow) return null;
        return { full_name: ACCOUNT.full_name, phone: ACCOUNT.phone, email: ACCOUNT.email };
      }

      // =================================================================
      // Chi tiết workflow
      // =================================================================
      async function loadWorkflow(workflowId) {
        try {
          const data = await api(`${API}/${encodeURIComponent(workflowId)}`);
          renderWorkflow(data);
          if (TERMINAL.has(data.status)) {
            stopPolling();
          } else {
            // Backend chưa có kênh realtime. Polling giãn dần để không dội
            // request, và giao diện không gợi ý đây là cập nhật trực tiếp.
            state.pollDelay = Math.min(state.pollDelay + 500, 5000);
            state.pollTimer = setTimeout(() => loadWorkflow(workflowId), state.pollDelay);
          }
        } catch (error) {
          stopPolling();
          toast(error.message);
        }
      }

      function renderWorkflow(data) {
        const [label, tone, icon] = WORKFLOW_STATUS[data.status] || WORKFLOW_STATUS.PENDING;
        const goal = state.goals[state.workflowId] || "";

        $("wfTitle").textContent = goal
          ? (goal.length > 70 ? `${goal.slice(0, 69)}…` : goal)
          : "Yêu cầu dịch vụ";
        const pill = $("wfStatus");
        pill.className = `pill ${tone}`;
        pill.textContent = `${icon} ${label}`;

        const objective = $("wfObjective");
        objective.hidden = !goal;
        objective.textContent = goal ? `“${goal}”` : "";

        renderSteps(data);
        renderLog(data.events || []);
        renderAction(data);
      }

      function renderSteps(data) {
        const plan = data.plan || [];
        const runtime = new Map((data.tasks || []).map((t) => [t.task_id, t]));
        const blueprint = plan.length ? plan : (data.tasks || []);

        const host = $("wfSteps");
        host.replaceChildren();
        let done = 0;
        let current = null;

        blueprint.forEach((entry) => {
          const live = runtime.get(entry.task_id);
          const status = live?.status || "PENDING";
          const [statusLabel, cls, glyph] = TASK_STATUS[status] || TASK_STATUS.PENDING;
          if (status === "SUCCESS") done += 1;
          if (!current && (status === "RUNNING" || status === "WAITING_APPROVAL")) {
            current = entry.title || live?.title;
          }

          const mark = el("span", { className: "s-mark" });
          mark.setAttribute("aria-hidden", "true");
          if (status === "RUNNING") mark.appendChild(el("span", { className: "spinner" }));
          else mark.textContent = glyph;

          const body = el("span", {},
            el("span", { className: "s-name", textContent: entry.title || live?.title || "Bước xử lý" }),
            el("span", { className: "s-note", textContent: live?.message || statusLabel }));

          if (live?.details?.length) {
            const dl = el("dl", { className: "kv" });
            live.details.forEach((d) => {
              dl.append(el("dt", { textContent: d.label }), el("dd", { textContent: d.value }));
            });
            body.appendChild(dl);
          }

          const li = el("li", { className: cls }, mark, body);
          if (status === "RUNNING") li.setAttribute("aria-current", "step");
          host.appendChild(li);
        });

        const total = blueprint.length;
        $("wfBar").style.width = total ? `${Math.round((done / total) * 100)}%` : "0%";
        $("wfCount").textContent = total ? `${done}/${total} bước` : "Đang chuẩn bị";

        const cur = $("wfCurrent");
        cur.hidden = !current;
        if (current) {
          cur.replaceChildren(document.createTextNode("Bước hiện tại: "), el("b", { textContent: current }));
        }
      }

      function renderLog(events) {
        const host = $("wfLog");
        host.replaceChildren();
        if (!events.length) {
          host.appendChild(el("li", { textContent: "Chưa có hoạt động nào." }));
          return;
        }
        // Chỉ hiện theo THỨ TỰ: `events[]` chưa có timestamp thật nên không
        // bịa ra giờ đồng hồ.
        events.forEach((event) => {
          host.appendChild(el("li", {}, el("span", { className: "lm" }), document.createTextNode(event.message)));
        });
      }

      // =================================================================
      // Thẻ hành động
      // =================================================================
      function renderAction(data) {
        const host = $("wfAction");
        host.replaceChildren();
        if (data.status === "WAITING_APPROVAL") host.appendChild(approvalCard(data));
        else if (data.status === "NEEDS_INFORMATION") host.appendChild(missingCard(data));
        else if (data.status === "SUCCESS") host.appendChild(resultCard(data));
        else if (["FAILED", "CANCELLED", "PLANNING_ERROR", "VALIDATION_ERROR", "EXECUTION_ERROR"].includes(data.status)) {
          host.appendChild(failureCard(data));
        }
      }

      function approvalCard(data) {
        const quote = data.payment_quote || null;
        const approve = el("button", { className: "btn primary", type: "button", textContent: "Xác nhận thanh toán" });
        const reject = el("button", { className: "btn ghost", type: "button", textContent: "Từ chối" });

        // Body CHỈ có decision. Không gửi amount/currency/booking_id/khoá
        // idempotency — backend đọc báo giá từ chỗ đã giữ trong hệ thống.
        const decide = async (decision) => {
          approve.disabled = true;
          reject.disabled = true;
          try {
            await api(`${API}/${encodeURIComponent(state.workflowId)}/payment-decision`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ decision }),
            });
            loadWorkflow(state.workflowId);
          } catch (error) {
            approve.disabled = false;
            reject.disabled = false;
            toast(error.message);
          }
        };
        approve.addEventListener("click", () => decide("approve"));
        reject.addEventListener("click", () => decide("reject"));

        const card = el("div", { className: "attention" },
          el("div", { className: "attention-head", textContent: "⏸ Chờ bạn quyết định" }),
          el("div", { className: "att-body", textContent: data.summary || "Yêu cầu này cần bạn xác nhận trước khi tiếp tục." }));

        if (quote) {
          const amount = el("div", { className: "amount", textContent: `Phí cần thanh toán: ${money(quote.amount, quote.currency)}` });
          amount.setAttribute("aria-label", `${Number(quote.amount).toLocaleString("vi-VN")} đồng`);
          card.append(amount, el("div", { className: "ro", textContent: "🔒 Số tiền do hệ thống xác định — bạn không cần nhập." }));
        }
        card.appendChild(el("div", { className: "att-actions" }, approve, reject));
        return card;
      }

      function missingCard(data) {
        const missing = data.missing_fields || [];
        const card = el("div", { className: "attention" },
          el("div", { className: "attention-head", textContent: "✎ Cần thêm thông tin" }),
          el("div", { className: "att-body", textContent: data.question || "Mình cần thêm một chút thông tin." }));

        const renderable = missing.filter((name) => FIELDS[name]);
        if (!renderable.length) {
          card.appendChild(el("div", { className: "ro", textContent: "Bạn mô tả thêm giúp mình nhé." }));
          return card;
        }

        const form = el("div", { className: "fields" });
        renderable.forEach((name) => form.appendChild(buildField(name)));

        const submit = el("button", { className: "btn primary", type: "button", textContent: "Tiếp tục" });
        submit.addEventListener("click", async () => {
          const controls = [...form.querySelectorAll("[data-field]")];
          const invalid = controls.find((c) => !c.checkValidity());
          if (invalid) { invalid.reportValidity(); return; }
          submit.disabled = true;
          const fields = {};
          controls.forEach((c) => { if (c.value !== "") fields[c.dataset.field] = c.value; });
          try {
            await api(`${API}/${encodeURIComponent(state.workflowId)}/continue`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ fields }),
            });
            loadWorkflow(state.workflowId);
          } catch (error) {
            submit.disabled = false;
            toast(error.message);
          }
        });

        card.append(form, el("div", { className: "att-actions" }, submit));
        return card;
      }

      function buildField(name) {
        const def = FIELDS[name];
        const wrap = el("div", { className: `field${def.full ? " full" : ""}` },
          el("label", { textContent: def.label, htmlFor: `f_${name}` }));

        let control;
        if (def.options) {
          control = el("select");
          // Không tự chọn option đầu: một lựa chọn chưa ai bấm mà đã nằm sẵn
          // trong form chính là dữ liệu bịa.
          const placeholder = el("option", { value: "", textContent: "Vui lòng chọn", disabled: true, selected: true });
          control.appendChild(placeholder);
          def.options.forEach(([value, text]) => control.appendChild(el("option", { value, textContent: text })));
        } else if (def.type === "textarea") {
          control = el("textarea", { rows: 2 });
        } else {
          control = el("input", { type: def.type || "text" });
          if (def.placeholder) control.placeholder = def.placeholder;
          if (def.min) control.min = def.min;
          if (def.max) control.max = def.max;
          if (def.type === "date") control.min = isoToday(0);
        }
        if (def.value) control.value = def.value;
        control.id = `f_${name}`;
        control.dataset.field = name;
        control.setAttribute("autocomplete", "off");
        if (def.required !== false) control.required = true;
        wrap.appendChild(control);

        if (def.hint) wrap.appendChild(el("div", { className: "field-hint", textContent: def.hint }));
        return wrap;
      }

      function resultCard(data) {
        const card = el("div", { className: "attention" },
          el("div", { className: "attention-head", textContent: "✓ Hoàn tất" }),
          el("div", { className: "att-body", textContent: data.summary || "Yêu cầu của bạn đã hoàn tất." }));
        card.style.cssText = "background:var(--ok-soft);border-color:var(--ok-line);border-left-color:var(--ok)";
        card.querySelector(".attention-head").style.color = "var(--ok)";
        if (data.persisted) card.appendChild(el("div", { className: "ro", textContent: "✓ Đã lưu vào hệ thống" }));
        return card;
      }

      function failureCard(data) {
        const [label] = WORKFLOW_STATUS[data.status] || ["Không thành công"];
        const card = el("div", { className: "attention" },
          el("div", { className: "attention-head", textContent: `✕ ${label}` }),
          el("div", { className: "att-body", textContent: data.summary || data.message || "Bạn thử lại hoặc mô tả rõ hơn giúp mình nhé." }));
        card.style.cssText = "background:var(--err-soft);border-color:var(--err-line);border-left-color:var(--err)";
        card.querySelector(".attention-head").style.color = "var(--err)";
        return card;
      }

      // =================================================================
      // Sự kiện
      // =================================================================
      $("goalInput").addEventListener("keydown", (event) => {
        // event.isComposing: đang gõ tiếng Việt qua IME thì Enter là để chốt
        // dấu, không phải để gửi.
        if (event.isComposing || event.keyCode === 229) return;
        if (event.key !== "Enter") return;
        event.preventDefault();
        const value = event.target.value.trim();
        if (!value) { toast("Bạn mô tả giúp mình việc cần làm nhé."); return; }
        event.target.value = "";
        state.contactFlow = false;
        startWorkflow(value);
      });

      document.querySelectorAll("[data-persona]").forEach((button) => {
        button.addEventListener("click", () => {
          state.accountState = button.dataset.persona;
          document.querySelectorAll("[data-persona]").forEach((other) =>
            other.setAttribute("aria-pressed", String(other === button)));
          applyPersona();
        });
      });

      document.querySelectorAll("[data-view]").forEach((button) => {
        button.addEventListener("click", async () => {
          const view = button.dataset.view;
          if (view === "services") {
            showHome(false); markNav("services");
            toast("Các dịch vụ hiển thị ở mục Bắt đầu nhanh.");
            return;
          }
          if (view === "profile") {
            showHome(false); markNav("profile");
            toast(state.accountState === "resident"
              ? "Tài khoản đã liên kết căn hộ A1201."
              : "Tài khoản chưa liên kết căn hộ.");
            return;
          }
          showHome(false);
          markNav(view);
          if (view === "overview") return;

          $("attentionSection").hidden = true;
          $("completedSection").hidden = true;
          $("goalSection").hidden = true;
          const titles = { running: "Đang thực hiện", attention: "Chờ bạn xử lý", completed: "Đã hoàn thành" };
          try {
            const data = await api(`${API}?status=${view}&limit=20`);
            renderActive(data.items || [], titles[view]);
          } catch (error) {
            toast(error.message);
          }
        });
      });

      // Khởi tạo. URL có workflow_id thì mở thẳng chi tiết và đọc lại trạng
      // thái từ hệ thống — refresh trang không làm mất việc đang chạy.
      applyPersona();
      const initialId = new URLSearchParams(location.search).get("workflow_id");
      if (initialId) showDetail(initialId, false);
      else showHome(false);
    </script>
  </body>
</html>
