[pytest]
markers =
    anonymous: chay client KHONG gan token (kiem chinh cong xac thuc)
; P-118 — pytest config
testpaths = tests
;
; Session-scoped async fixtures (e.g. the asyncpg pool in tests/test_db/conftest.py)
; must share the same event loop as the async tests that use them. Align both
; fixture and test loop scopes to "session" to avoid:
;   RuntimeError: ... attached to a different loop
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
